name: sitracalco-prod

services:
  auth:
    build:
      context: .
      dockerfile: sitraCalco.Authentication/Dockerfile
    image: sitracalco/authentication:prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      SecretManager__ProjectId: "calco-sa-508817"
      SecretManager__SecretId: "sitracalco-prod-auth-config"
    ports:
      - "127.0.0.1:5201:8080"
    volumes:
      - /opt/apps/sitracalco/certs/server-ca.pem:/certs/server-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - prod_internal

  inventory:
    build:
      context: .
      dockerfile: sitraCalco.Inventory/Dockerfile
    image: sitracalco/inventory:prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      SecretManager__ProjectId: "calco-sa-508817"
      SecretManager__SecretId: "sitracalco-prod-inventory-config"
    ports:
      - "127.0.0.1:5202:8080"
    volumes:
      - /opt/apps/sitracalco/certs/server-ca.pem:/certs/server-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - prod_internal

  kitchen:
    build:
      context: .
      dockerfile: sitraCalco.KitchenTraceability/Dockerfile
    image: sitracalco/kitchentraceability:prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTP_PORTS: "8080"
      SecretManager__ProjectId: "calco-sa-508817"
      SecretManager__SecretId: "sitracalco-prod-kitchen-config"
    ports:
      - "127.0.0.1:5203:8080"
    volumes:
      - /opt/apps/sitracalco/certs/server-ca.pem:/certs/server-ca.pem:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=64m,uid=1654,gid=1654
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    networks:
      - prod_internal

networks:
  prod_internal:
    driver: bridge